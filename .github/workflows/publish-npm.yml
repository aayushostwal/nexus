name: Publish npm

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish
        env:
          # Use an npm Automation token. Classic tokens tied to 2FA will fail with EOTP.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          scripts/publish-npm.sh --publish --skip-git-check
