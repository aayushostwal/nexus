name: Release

# Releases are intentional. Choose patch for fixes, minor for compatible features,
# and major for removed/renamed public commands or other breaking contracts.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver increment: patch=fix, minor=feature, major=breaking change'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: nexus-release
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Bump canonical version and synchronize manifests
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = ['.claude-plugin/plugin.json', '.codex-plugin/plugin.json', '.claude-plugin/marketplace.json', '.agents/plugins/marketplace.json'];
          const current = JSON.parse(fs.readFileSync(files[0], 'utf8')).version;
          const values = current.split('.').map(Number);
          const index = {major:0, minor:1, patch:2}[process.env.BUMP];
          if (index === undefined || !/^\d+\.\d+\.\d+$/.test(current)) throw Error('Invalid increment/version');
          values[index] += 1;
          for (let i=index+1; i<3; i++) values[i]=0;
          const version = values.join('.');
          for (const file of files) {
            const manifest=JSON.parse(fs.readFileSync(file,'utf8'));
            manifest.version=version;
            for (const plugin of manifest.plugins || []) plugin.version=version;
            fs.writeFileSync(file,JSON.stringify(manifest,null,2)+'\n');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${version}\n`);
          NODE
      - name: Refresh and validate generated content
        run: |
          node scripts/generate-catalog.js
          node scripts/generate-catalog.js --check
          node scripts/validate-content.js
          node --test test/*.test.js
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag v${{ steps.version.outputs.value }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --unreleased --tag v${{ steps.version.outputs.value }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Commit and publish tested release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .claude-plugin/plugin.json .codex-plugin/plugin.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json catalog/generated.json README.md apps/nexus-web/content/docs/getting-started/quickstart.mdx
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          # Atomic, fast-forward-only push refuses to publish over newer main changes.
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file RELEASE_NOTES.md --latest
