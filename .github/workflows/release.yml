name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  # A: CI/CD — only when actor is NOT github-bot
  ci:
    if: github.actor != 'github-bot'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate npm package
        run: npm pack --dry-run

  # B: Bump version and push commit as github-bot — only when actor is NOT github-bot
  upgrade-version:
    if: github.actor != 'github-bot'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump minor version
        run: |
          CURRENT=$(npm pkg get version | tr -d '"')
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          npm pkg set version=$NEW_VERSION
          echo "Bumped $CURRENT → $NEW_VERSION"

      - name: Commit and push version bump
        run: |
          git config user.name "github-bot"
          git config user.email "bot@github.com"
          VERSION=$(npm pkg get version | tr -d '"')
          git add package.json
          git commit -m "chore: bump version to $VERSION"
          git push origin main

  # C-E: Publish, changelog, tag — triggered by github-bot's version bump commit
  publish-release:
    if: github.actor == 'github-bot'
    runs-on: ubuntu-latest

    steps:
      # C: Read version from package.json
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Get version
        id: version
        run: echo "value=$(npm pkg get version | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      # D: Publish to npm
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # E: Generate changelog with git-cliff
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # E: Push tag
      - name: Commit changelog and push tag
        run: |
          git config user.name "github-bot"
          git config user.email "bot@github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for v${{ steps.version.outputs.value }}" || echo "No changelog changes"
          git push origin main || echo "Nothing to push"
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"
