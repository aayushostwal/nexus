name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  # Step A: Run CI/CD (only when user is NOT github-bot)
  ci:
    if: ${{ github.actor != 'github-bot' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate npm package
        run: npm pack --dry-run

  # Step B: Upgrade and sync versions, push new commit
  upgrade-version:
    runs-on: ubuntu-latest
    needs: ci
    if: |
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    outputs:
      version: ${{ steps.upgrade.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upgrade minor version
        id: upgrade
        run: |
          CURRENT_VERSION=$(npm pkg get version | tr -d '"')
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$NEW_MINOR.0"
          npm pkg set version=$NEW_VERSION
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push version bump
        run: |
          git config user.name "github-bot"
          git config user.email "bot@github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.upgrade.outputs.version }}"
          git push origin main

  # Steps C-F: Publish, create changelog, push tag (only when user is github-bot)
  publish-release:
    runs-on: ubuntu-latest
    needs: upgrade-version
    if: ${{ github.actor == 'github-bot' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Verify package
        run: |
          npm run lint
          npm test
          npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Generate changelog
        run: |
          git-cliff --output CHANGELOG.md

      - name: Commit and push changelog
        run: |
          git config user.name "github-bot"
          git config user.email "bot@github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for v${{ needs.upgrade-version.outputs.version }}" || echo "No changelog changes"
          git push origin main || echo "No new commits to push"

      - name: Create and push git tag
        run: |
          git tag "v${{ needs.upgrade-version.outputs.version }}"
          git push origin "v${{ needs.upgrade-version.outputs.version }}"
