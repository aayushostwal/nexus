name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # A: CI — lint, test, validate
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate npm package
        run: npm pack --dry-run

  # B-E: Bump version, publish, changelog, tag — all in one run
  release:
    needs: ci
    runs-on: ubuntu-latest
    # GITHUB_TOKEN pushes don't re-trigger workflows, so no infinite loop risk
    # This guard skips the release job on any bot-initiated push (e.g. PAT)
    if: github.actor != 'github-actions[bot]'

    steps:
      # B: Bump minor version
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Bump minor version
        run: |
          CURRENT=$(npm pkg get version | tr -d '"')
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          npm pkg set version=$NEW_VERSION
          echo "Bumped $CURRENT → $NEW_VERSION"

      # C: Read version
      - name: Get version
        id: version
        run: echo "value=$(npm pkg get version | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      # D: Publish to npm
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # E: Generate full CHANGELOG.md for the repo
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # E: Generate release notes for this version only
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      # E: Commit version bump + changelog, push tag, create GitHub Release
      - name: Commit, tag, and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.version.outputs.value }}" || echo "Nothing to commit"
          git push origin main
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"
          gh release create "v${{ steps.version.outputs.value }}" \
            --title "v${{ steps.version.outputs.value }}" \
            --notes-file RELEASE_NOTES.md \
            --latest
