name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find scripts test skills -name '*.js' -o -name '*.cjs' | xargs -n1 node --check
      - name: Test helper scripts
        run: node --test test/*.test.js
      - name: Verify software-engineer regression fixture
        run: node skills/software-engineer/evaluations/verify-fixture.cjs
      - name: Validate skills, agents, and manifests
        run: node scripts/validate-content.js
      - name: Check README catalog is current
        run: node scripts/generate-catalog.js --check
