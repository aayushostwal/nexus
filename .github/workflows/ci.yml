name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nexus-web/package-lock.json
      - name: Check JavaScript syntax
        run: find bin scripts test -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Test helpers and content validation
        run: node --test test/*.test.js
      - name: Verify software engineer regression fixture
        run: node skills/software-engineer/evaluations/verify-fixture.cjs
      - name: Validate content and manifests
        run: node scripts/validate-content.js
      - name: Check generated catalog
        run: node scripts/generate-catalog.js --check
      - name: Install website dependencies
        working-directory: apps/nexus-web
        run: npm ci
      - name: Build website
        working-directory: apps/nexus-web
        run: npm run build
      - name: Install browser for interface checks
        working-directory: apps/nexus-web
        run: npx playwright install --with-deps chromium
      - name: Verify interface interactions and accessibility
        working-directory: apps/nexus-web
        run: npm run test:browser
